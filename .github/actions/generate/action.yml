name: Generate code
description: Generate the gitignored go-jet packages with the pinned generator
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache: false
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: go -C backend run ./cmd/jetgen internal/gen/jet
