# Tests on every push and pull request, and builds the application image and
# the Camoufox browser server for linux/amd64 and linux/arm64 beside them. A
# pull request only builds. On a push to master or a `v*` tag the images are
# pushed under the commit sha, one multi-arch index per image; once every test
# has passed, the same indexes are also tagged `latest`, and the version for a
# tag. The sha tags are what a rollback pins to, and a sha whose tests failed
# never becomes `latest` or a version.
#
# Every job has a time limit, so a hung download or runner fails the run
# rather than holding it for hours.
#
# Publishing is opt-in per repository, so a fork runs the tests and skips the
# publish rather than failing at the registry login. Repository variables:
#
#   PUBLISH_IMAGE   `true` to publish (setting IMAGE also turns it on)
#   REGISTRY        default ghcr.io
#   IMAGE           default ghcr.io/<owner>/<repo>, lowercased
#   REGISTRY_USER   default the actor that triggered the run
#
# and the secret REGISTRY_TOKEN, defaulting to the job's own GITHUB_TOKEN,
# which is all ghcr.io needs.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A superseded pull-request run is cancelled. A master run never is: every
# commit that reaches master gets its image by sha, which is what a rollback
# needs. Each commit outside a pull request is its own group, so a run that
# never finishes cannot hold every later commit's run waiting.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE: ${{ vars.IMAGE || format('ghcr.io/{0}', github.repository) }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.group }}
    runs-on: ubuntu-latest
    # Pure-Go SQLite is substantially slower under -race, so the suite is split
    # four ways by how long each part takes on a 4-core runner: internal/api's
    # tests in two halves, the storage and service packages, and every other
    # package with the one-off checks.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [api-0, api-1, storage, rest]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Postgres is only the source for the one-time legacy import, but that
      # import is what every existing install depends on, so its tests must run
      # here rather than skip. Installed from apt rather than as a `services:`
      # container, because not every runner can start service containers.
      - name: Start Postgres (legacy import tests)
        if: matrix.group == 'rest'
        run: |
          SUDO=""; command -v sudo >/dev/null && SUDO=sudo
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq postgresql >/dev/null
          $SUDO pg_ctlcluster "$(ls /etc/postgresql)" main start || true
          $SUDO su postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE USER agentifi PASSWORD 'agentifi' SUPERUSER\" -c \"CREATE DATABASE agentifi OWNER agentifi\""
          pg_isready -h localhost

      # `//go:embed all:dist` needs the directory to exist, and it is built by
      # the frontend and never committed. The tests only ask for an index.html,
      # so a placeholder stands in for the bundle the image's frontend stage
      # builds for real.
      - name: Placeholder frontend bundle
        run: |
          mkdir -p internal/web/dist
          printf '<!doctype html><html><head><title>placeholder</title></head><body></body></html>\n' > internal/web/dist/index.html

      # gofmt exits 0 whether or not it would reformat anything, so the check
      # has to be on its output. go vet is the compile-adjacent half.
      - name: Formatting and vet
        if: matrix.group == 'rest'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
          go vet ./...

      # Running migrate twice exercises the guard that a second run is a no-op,
      # and proves the embedded migrations and the running code agree before
      # an image carrying both is published.
      - name: Migrations apply and are idempotent
        if: matrix.group == 'rest'
        env:
          DATA_DIR: ${{ runner.temp }}/agentifi-migrations
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
        run: |
          go run ./cmd/agentifi migrate
          go run ./cmd/agentifi migrate

      # SQLite tests create their own temporary databases. TEST_DATABASE_URL
      # feeds the legacy import tests, which would otherwise skip. The storage
      # group is named here, so `rest` is everything else and a new package
      # cannot be left out.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://agentifi:agentifi@localhost:5432/agentifi?sslmode=disable
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          GROUP: ${{ matrix.group }}
        run: |
          storage='/internal/(service|store|sqlitedb)$'
          case "$GROUP" in
            api-*)
              half=${GROUP#api-}
              tests=$(go test -race -list '^Test' ./internal/api | grep '^Test' | awk -v s="$half" 'NR % 2 == s' | paste -sd '|' -)
              test -n "$tests"
              go test -race -timeout 12m -run "^($tests)\$" ./internal/api
              ;;
            storage)
              # shellcheck disable=SC2046 # one argument per package
              go test -race -timeout 12m $(go list ./... | grep -E "$storage")
              ;;
            rest)
              # shellcheck disable=SC2046 # one argument per package
              go test -race -timeout 12m $(go list ./... | grep -vE "$storage" | grep -v '/internal/api$')
              ;;
          esac

  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # deadcode roots its search at the binaries only, so a function that only
    # its own test calls is reported — a calculation nothing reaches is a
    # number the app never shows. The domain and service packages must report
    # nothing but the four constructors kept to complete a family whose other
    # members are live; the rest of the tree (test stubs in internal/browser,
    # testdb, storetest) is printed for reading, not checked.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Only the backend job keeps the Go cache: jobs sharing its key each
      # save a multi-gigabyte copy on a runner whose cache never evicts.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: No unreached functions in domain or service
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 ./...)
          printf '%s\n' "$out"
          unexpected=$(printf '%s\n' "$out" \
            | grep -E '^internal/(domain|service)/' \
            | grep -vE ': unreachable func: (TwiceAMonth|MultipleFixed|OneTime|AnyAmount)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::warning title=Unreached code::production code in domain or service has no non-test caller"
            printf '%s\n' "$unexpected"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: clients/apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      # The only type check: `tsc -b` then the same build the image's frontend
      # stage runs, earlier and with a readable error. `tsc --noEmit` would be
      # a no-op against this repo's solution-style tsconfig.
      - run: npm run build

  layout:
    name: Layout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every top-level page at phone, tablet, laptop and desktop widths in a
    # real Chromium, against the invented fixtures in clients/apps/web/layout/. A
    # violation that is not in layout/allowlist.ts fails the job; the
    # screenshots are uploaded either way so a failure can be looked at.
    #
    # It takes several times longer than every other job together, so it runs
    # only when the workflow is started by hand, and never gates the image.
    if: github.event_name == 'workflow_dispatch'
    #
    # `--with-deps` installs Chromium's system libraries through apt, so it
    # needs root or sudo.
    defaults:
      run:
        working-directory: clients/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run layout

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: clients/apps/web/layout/output/
          if-no-files-found: ignore

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 9
    # The tests that drive a real Google Chrome against invented pages: sign-in
    # walls, payment drafts, merchant order pages. The backend job runs the
    # same packages with them skipped.
    #
    # On the runner rather than inside the image: the image is ubuntu:24.04,
    # so running on ubuntu-latest keeps Chrome's libraries matched to the same
    # release. Chrome is installed by the script the compose file's chrome
    # service runs, so these tests drive the stable Chrome an install gets,
    # and the driver is assembled by the script a workstation uses. Nothing
    # here is a second recipe and no gigabyte image is built just to be thrown
    # away. Playwright's install-deps uses sudo when it is not root.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Assemble the Playwright driver
        run: ../scripts/playwright-driver.sh

      - name: Install Google Chrome stable
        timeout-minutes: 4
        run: |
          driver="$HOME/.cache/ms-playwright-go/$(../scripts/playwright-driver.sh --version)"
          "$driver/node" "$driver/package/cli.js" install-deps chromium
          ../scripts/install-chrome.sh "$RUNNER_TEMP/chrome"
          "$RUNNER_TEMP/chrome/current/chrome" --version
          echo "AGENTIFI_CHROME_PATH=$RUNNER_TEMP/chrome/current/chrome" >> "$GITHUB_ENV"

      # Every package with a test behind AGENTIFI_BROWSER_TEST, found rather
      # than listed, so a new one cannot be left out and skip unseen.
      - name: Test
        env:
          AGENTIFI_BROWSER_TEST: "1"
        run: |
          mapfile -t packages < <(grep -rl --include='*_test.go' AGENTIFI_BROWSER_TEST ./internal | xargs -n1 dirname | sort -u)
          test "${#packages[@]}" -gt 0
          printf '%s\n' "${packages[@]}"
          go test -timeout 6m "${packages[@]}"

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    # A pull request builds both images for both architectures, so a change
    # that breaks an image fails before master rather than after it, and
    # neither logs in nor pushes. On master or a tag, a repository that has
    # opted in pushes each architecture untagged, by digest, for the sha job
    # to join; one that has not (a fork) skips this job rather than failing
    # the login.
    #
    # Each architecture builds on a runner of its own rather than under QEMU,
    # which runs the Go and npm stages several times slower. Google builds no
    # arm64 Chrome, so on arm64 the chrome service says so and installs none
    # (scripts/install-chrome.sh); Camoufox has an arm64 build.
    if: github.event_name == 'pull_request' || vars.PUBLISH_IMAGE == 'true' || vars.IMAGE != ''
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: the image
            key: app
            suffix: ''
            context: .
          - name: the Camoufox server
            key: camoufox
            suffix: -camoufox
            context: tools/camoufox
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registries refuse upper case, and github.repository keeps the owner's.
      - name: Lowercase the image name
        shell: bash
        run: echo "IMAGE=${IMAGE,,}${{ matrix.image.suffix }}" >> "${GITHUB_ENV}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build time
        id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          # The commit Server admin shows; the build context has no .git. The
          # Camoufox server declares neither and ignores them.
          build-args: |
            AGENTIFI_COMMIT=${{ github.sha }}
            AGENTIFI_BUILT_AT=${{ steps.built.outputs.at }}
          # The source label is what links the package to this repository on
          # GitHub; without it the package page never shows new versions there.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # One cache per image and architecture. mode=max keeps the npm and
          # Go stages, which are most of the build, at about 5 GB for the
          # four; only master writes it, since a copy per pull request would
          # overrun the repository's 10 GB and evict the Go caches. A pull
          # request reads master's.
          cache-from: type=gha,scope=${{ matrix.image.key }}-${{ matrix.platform.arch }}
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,scope={0}-{1},mode=max', matrix.image.key, matrix.platform.arch) || '' }}
          # Without provenance each digest is a plain image manifest, which
          # is what the sha job joins into one index.
          provenance: false

      - name: Record the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digest"
          touch "${RUNNER_TEMP}/digest/${DIGEST#sha256:}"

      - name: Hand the digest to the sha job
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.key }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  sha:
    name: Tag the sha
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Joins each image's architectures into one index under the commit sha,
    # beside the tests and whatever they conclude: the sha tag is what a
    # rollback pins to, and a pull of it picks the host's architecture.
    needs: [build]
    if: github.event_name != 'pull_request' && (vars.PUBLISH_IMAGE == 'true' || vars.IMAGE != '')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase the image name
        shell: bash
        run: echo "IMAGE=${IMAGE,,}" >> "${GITHUB_ENV}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      # Every architecture is named rather than found, so an index can never
      # be pushed with one missing. A multi-arch package's link to this
      # repository is read from the index's annotation, not from a label.
      - name: Join the architectures under the sha
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          for key in app camoufox; do
            image="${IMAGE}"
            [ "${key}" = camoufox ] && image="${IMAGE}-camoufox"
            refs=()
            for arch in amd64 arm64; do
              digests=("digest-${key}-${arch}"/*)
              test "${#digests[@]}" = 1
              test -f "${digests[0]}"
              refs+=("${image}@sha256:$(basename "${digests[0]}")")
            done
            docker buildx imagetools create -t "${image}:${GITHUB_SHA}" \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              "${refs[@]}"
            docker buildx imagetools inspect "${image}:${GITHUB_SHA}"
          done

  publish:
    name: Tag latest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [backend, deadcode, browser, frontend, sha]
    if: github.event_name != 'pull_request' && (vars.PUBLISH_IMAGE == 'true' || vars.IMAGE != '')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase the image name
        shell: bash
        run: echo "IMAGE=${IMAGE,,}" >> "${GITHUB_ENV}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # A registry-side copy of the tested sha's index: nothing is pulled or
      # rebuilt, and a single index source is copied byte for byte, so
      # `latest` and a version carry the sha's own digest. `latest` moves on
      # every build, including a tag build; a version tag rides along when
      # one was pushed. The Camoufox server gets exactly the same tags, so
      # AGENTIFI_TAG pins the pair.
      - name: Tag the tested images
        run: |
          for image in "${IMAGE}" "${IMAGE}-camoufox"; do
            tags=(-t "${image}:latest")
            case "${GITHUB_REF}" in
              refs/tags/v*) tags+=(-t "${image}:${GITHUB_REF#refs/tags/}") ;;
            esac
            docker buildx imagetools create "${tags[@]}" "${image}:${GITHUB_SHA}"
          done

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # A version tag becomes a GitHub release once its images carry the
    # version, so a release never names an image that is not there. The notes
    # are the commit subjects since the previous version tag. A release that
    # already exists is left alone, so a rerun or one written by hand is kept.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release"; exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            git log --no-merges --format='- %s' "$range" | grep -vE '^- Version [0-9]' || true
            image="${IMAGE,,}"
            printf '\nImage: `%s:%s`\n' "$image" "$TAG"
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
