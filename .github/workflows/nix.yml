# Builds the Nix package and boots the NixOS VM test on every pull request, so
# a Go or frontend change that breaks the Nix build is red before it merges.
# A go.sum change needs a new vendorHash in nix/package.nix: the failing log
# prints it ("got: sha256-…"), so no local Nix install is needed to fix it.
name: nix

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check -L
