# Builds the Nix package and boots the NixOS VM test on every pull request, so
# a Go or frontend change that breaks the Nix build is red before it merges.
# A go.sum change needs a new vendorHash in nix/package.nix: the failing log
# prints it ("got: sha256-…"), so no local Nix install is needed to fix it.
name: nix

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Builds Go, the frontend and a NixOS VM from cold caches.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - run: nix flake check -L
