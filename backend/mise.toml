[tasks.build]
run = "go build ./..."

[tasks.lint]
# gofmt -l prints the files it would change and exits 0, so the check has to be
# on its output rather than its status.
run = ["test -z \"$(gofmt -l .)\"", "go vet ./..."]

[tasks.test]
# Tests use temporary SQLite files. Only the one-time legacy import tests
# optionally use TEST_DATABASE_URL; see ../CONTRIBUTING.md.
run = "go test ./internal/..."

[tasks.dev]
run = "go run ./cmd/agentifi serve"

[tasks.migrate]
run = "go run ./cmd/agentifi migrate"

[tasks.seed]
description = "Seed invented deterministic development data in SQLite (DATA_DIR)"
run = "go run ./cmd/seed"

[tasks.portcheck]
description = "Snapshot and compare application behaviour across storage ports"
run = "go run ./cmd/portcheck"
