[tasks.build]
run = "go build ./..."

[tasks.lint]
# gofmt -l prints the files it would change and exits 0, so the check has to be
# on its output rather than its status.
run = ["test -z \"$(gofmt -l .)\"", "go vet ./..."]

[tasks.test]
# Every database-backed test makes its own SQLite file. internal/pgimport's
# end-to-end tests also need a Postgres at TEST_DATABASE_URL and skip without
# one — a skipped test looks exactly like a passing one, so see
# ../scripts/dev-postgres.py.
run = "go test ./internal/..."

[tasks.dev]
run = "go run ./cmd/agentifi serve"

[tasks.migrate]
run = "go run ./cmd/agentifi migrate"
