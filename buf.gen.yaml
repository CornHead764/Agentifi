# Run from the repository root: `mise run gen`. The Go plugins are tool
# dependencies of the backend module, so their versions are go.mod's; the
# TypeScript plugin is the web app's devDependency, so `npm install` in clients/ first.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/CornHead764/agentifi/backend/internal/gen
plugins:
  - local: [go, -C, ../../backend, tool, protoc-gen-go]
    out: ../../backend/internal/gen
    opt: paths=source_relative
  - local: [go, -C, ../../backend, tool, protoc-gen-connect-go]
    out: ../../backend/internal/gen
    opt:
      - paths=source_relative
      - simple
  - local: ../../clients/node_modules/.bin/protoc-gen-es
    out: ../../clients/apps/web/src/gen
    opt:
      - target=ts
      - erasable_syntax=true
