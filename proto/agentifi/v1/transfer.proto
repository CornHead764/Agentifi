syntax = "proto3";

package agentifi.v1;

import "agentifi/v1/common.proto";
import "agentifi/v1/options.proto";

// Transfer activity: what moved between the household's own accounts, and the
// operations that fix a pairing the rules got wrong. internal/service owns the
// matching rules; nothing here pairs anything by itself.
//
// A hand-made pair is exempt from trap 3 and from equal magnitude; both rows
// must still be live and unpaired, in two accounts of one space, in one
// currency, one paying and one receiving.
//
// Windows are on the posted date, not the effective date (trap 4): the two
// legs of one movement can be a statement cycle apart in effective date, which
// would split the pair across windows. A date_field is not read.
service TransferService {
  option (scope) = SCOPE_TENANT;
  option (rest_prefix) = "/transfers";

  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/transfers"
    };
  }

  // The unpaired rows a person can join, hand-entered ones included.
  rpc ListTransferCandidates(ListTransferCandidatesRequest) returns (ListTransferCandidatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/transfers/candidates"
    };
  }

  // Trap 2 made visible: legs still carrying a pair token whose partner is
  // gone.
  rpc ListOrphanTransferLegs(ListOrphanTransferLegsRequest) returns (ListOrphanTransferLegsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/transfers/orphans"
    };
  }

  rpc PairTransfer(PairTransferRequest) returns (PairTransferResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "POST"
      path: "/transfers"
      status: 201
      response_body: "transfer"
    };
  }

  // Runs the pairer over the whole ledger; the sync pairs only the rows it
  // just wrote.
  rpc DetectTransfers(DetectTransfersRequest) returns (DetectTransfersResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "POST"
      path: "/transfers/detect"
      body_optional: true
    };
  }

  // Releases every leg whose partner is gone, answering the legs released.
  rpc RepairOrphanTransferLegs(RepairOrphanTransferLegsRequest) returns (RepairOrphanTransferLegsResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "POST"
      path: "/transfers/orphans/repair"
      body_optional: true
    };
  }

  // Releases a pair without deleting either transaction; both count as income
  // and expense again.
  rpc UnpairTransfer(UnpairTransferRequest) returns (UnpairTransferResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "DELETE"
      path: "/transfers/{pair_id}"
      status: 204
    };
  }
}

// One side of a movement.
message TransferLeg {
  string transaction_id = 1;
  string account_id = 2;
  string account_name = 3;
  // The posted day.
  string date = 4;
  Money amount = 5;
  string currency = 6;
  string payee = 7;
  string source = 8;
  // Set on an orphan leg, unset on a candidate for pairing.
  optional string pair_id = 9;
}

// One paired movement under a token both legs carry.
message Transfer {
  string pair_id = 1;
  // The later of the two posted dates, when the money had finished moving.
  string moved_on = 2;
  // The magnitude, from the paying leg.
  Money amount = 3;
  string currency = 4;
  TransferLeg from = 5;
  TransferLeg to = 6;
  // A person's decision, as against the rules' guess.
  bool paired_by_hand = 7;
}

message ListTransfersRequest {
  // "YYYY-MM-DD"; empty is open at that end.
  string from = 1;
  string to = 2;
  // 1 to 1000; unset is 200.
  optional int32 limit = 3;
}

message ListTransfersResponse {
  repeated Transfer transfers = 1;
  Window window = 2;
  // The repair job's finding over the whole space, not the window: an
  // orphaned leg is wrong wherever it sits.
  int32 orphan_count = 3;
}

message ListTransferCandidatesRequest {
  string from = 1;
  string to = 2;
  optional int32 limit = 3;
}

message ListTransferCandidatesResponse {
  repeated TransferLeg candidates = 1;
  Window window = 2;
}

message ListOrphanTransferLegsRequest {}

message ListOrphanTransferLegsResponse {
  repeated TransferLeg orphans = 1;
}

message PairTransferRequest {
  string paying_transaction_id = 1;
  string receiving_transaction_id = 2;
}

message PairTransferResponse {
  Transfer transfer = 1;
}

message DetectTransfersRequest {}

message DetectTransfersResponse {
  int32 paired = 1;
}

message RepairOrphanTransferLegsRequest {}

message RepairOrphanTransferLegsResponse {
  repeated TransferLeg orphans = 1;
}

message UnpairTransferRequest {
  string pair_id = 1;
}

message UnpairTransferResponse {}
