syntax = "proto3";

package agentifi.v1;

import "agentifi/v1/common.proto";
import "agentifi/v1/options.proto";
import "google/protobuf/field_mask.proto";

// The banks the household's accounts are held at, and the setting that belongs
// to a bank: hiding every account there that holds next to nothing
// (domain.HiddenForSmallBalance). The institution's rather than the
// connection's, because one SimpleFIN connection spans every linked bank.
// Institutions are created by the sync only.
service InstitutionService {
  option (scope) = SCOPE_TENANT;
  option (rest_prefix) = "/institutions";

  rpc ListInstitutions(ListInstitutionsRequest) returns (ListInstitutionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/institutions"
      response_body: "institutions"
    };
  }

  rpc UpdateInstitution(UpdateInstitutionRequest) returns (UpdateInstitutionResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "PATCH"
      path: "/institutions/{institution_id}"
      response_body: "institution"
    };
  }
}

message Institution {
  string id = 1;
  string name = 2;
  optional string logo_url = 3;
  // Unset when the institution hides nothing.
  NullableMoney hide_below_balance = 4;
}

message ListInstitutionsRequest {}

message ListInstitutionsResponse {
  repeated Institution institutions = 1;
}

// hide_below_balance is required: set it, or name it in update_mask and leave
// it unset to clear it. It cannot be negative.
message UpdateInstitutionRequest {
  string institution_id = 1;
  NullableMoney hide_below_balance = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateInstitutionResponse {
  Institution institution = 1;
}
