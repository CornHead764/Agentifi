syntax = "proto3";

package agentifi.v1;

import "agentifi/v1/common.proto";
import "agentifi/v1/filter.proto";
import "agentifi/v1/options.proto";
import "google/protobuf/field_mask.proto";

// Watchlists: a saved slice of spending, backed by the one filter entity.
// Spend is the net of the matching rows, so a refund reduces it
// (calculations.md §13). There is no twelve-month average: the client
// averages the full months of the trend, so the bars and the average cannot
// disagree.
service WatchlistService {
  option (scope) = SCOPE_TENANT;
  option (rest_prefix) = "/watchlists";

  rpc ListWatchlists(ListWatchlistsRequest) returns (ListWatchlistsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/watchlists"
      response_body: "watchlists"
    };
  }

  rpc CreateWatchlist(CreateWatchlistRequest) returns (CreateWatchlistResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "POST"
      path: "/watchlists"
      status: 201
      response_body: "watchlist"
    };
  }

  // The card plus one month's breakdown by category, payee and tag.
  rpc GetWatchlist(GetWatchlistRequest) returns (GetWatchlistResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/watchlists/{watchlist_id}"
      response_body: "watchlist"
    };
  }

  rpc UpdateWatchlist(UpdateWatchlistRequest) returns (UpdateWatchlistResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "PATCH"
      path: "/watchlists/{watchlist_id}"
      response_body: "watchlist"
    };
  }

  // Soft-deletes the watchlist and the filter only it uses.
  rpc DeleteWatchlist(DeleteWatchlistRequest) returns (DeleteWatchlistResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "DELETE"
      path: "/watchlists/{watchlist_id}"
      status: 204
    };
  }
}

// The card. Its figures are always about now.
message WatchlistSummary {
  string id = 1;
  string name = 2;
  string filter_id = 3;
  optional string emoji = 4;
  // month, quarter, year or custom, as stored.
  string period = 5;
  NullableMoney target_amount = 6;
  // Negative once the target is breached; unset with no target.
  NullableMoney left_to_target = 7;
  // A rate; unset with no target and with a target of zero.
  optional string pct_of_target = 8;
  bool is_over_target = 9;
  bool is_projected_over_target = 10;
  Money this_month_spent = 11;
  Money month_projection = 12;
  Money year_to_date = 13;
  repeated WatchlistTrendEntry monthly_trend = 14;
  // "YYYY-MM-DD".
  string as_of = 15;
}

// One bar of the Overtime chart. is_partial marks the current month, which
// no average may include.
message WatchlistTrendEntry {
  // "YYYY-MM".
  string month = 1;
  Money spent = 2;
  bool is_partial = 3;
}

// The card's fields, then the breakdown of the month the person selected.
message WatchlistDetail {
  string id = 1;
  string name = 2;
  string filter_id = 3;
  optional string emoji = 4;
  string period = 5;
  NullableMoney target_amount = 6;
  NullableMoney left_to_target = 7;
  optional string pct_of_target = 8;
  bool is_over_target = 9;
  bool is_projected_over_target = 10;
  Money this_month_spent = 11;
  Money month_projection = 12;
  Money year_to_date = 13;
  repeated WatchlistTrendEntry monthly_trend = 14;
  string as_of = 15;
  // "YYYY-MM".
  string month = 16;
  Money spent = 17;
  repeated WatchlistBreakdownEntry by_category = 18;
  repeated WatchlistBreakdownEntry by_payee = 19;
  repeated WatchlistBreakdownEntry by_tag = 20;
}

// One slice of the Category / Payee / Tag donut. key is a category or tag id,
// or the payee's name; both key and label are empty for the uncategorized or
// untagged slice. A two-tag row counts fully under each tag, so shares can
// pass 100%.
message WatchlistBreakdownEntry {
  string key = 1;
  string label = 2;
  Money spent = 3;
  // A fraction of the month's spend; unset when there was none.
  optional string share = 4;
}

message ListWatchlistsRequest {}

message ListWatchlistsResponse {
  repeated WatchlistSummary watchlists = 1;
}

// Exactly one of filter_id, items, category_ids, payee_names and tag_ids.
// filter_id points at an existing saved filter; the others are written into a
// filter the watchlist owns.
message CreateWatchlistRequest {
  string name = 1;
  optional string emoji = 2;
  NullableMoney target_amount = 3;
  // month when unset.
  optional string period = 4;
  optional string filter_id = 5;
  repeated FilterItemWrite items = 6;
  repeated string category_ids = 7;
  repeated string payee_names = 8;
  repeated string tag_ids = 9;
  // 13 when unset; at most 60.
  optional int32 trend_months = 10;
}

message CreateWatchlistResponse {
  WatchlistSummary watchlist = 1;
}

message GetWatchlistRequest {
  string watchlist_id = 1;
  // "YYYY-MM"; this month when empty.
  string month = 2;
}

message GetWatchlistResponse {
  WatchlistDetail watchlist = 1;
}

// A field named in update_mask and left unset is cleared; a field not named is
// left alone. filter_id repoints the card; items rewrite the selection, in
// place when the watchlist owns its filter and into a new owned one
// otherwise. At most one of the two.
message UpdateWatchlistRequest {
  string watchlist_id = 1;
  // Cannot be cleared.
  optional string name = 2;
  optional string emoji = 3;
  NullableMoney target_amount = 4;
  // Cannot be cleared.
  optional string period = 5;
  // Cannot be cleared.
  optional string filter_id = 6;
  // Replaced whole when named; cannot be emptied.
  repeated FilterItemWrite items = 7;
  google.protobuf.FieldMask update_mask = 8;
}

message UpdateWatchlistResponse {
  WatchlistSummary watchlist = 1;
}

message DeleteWatchlistRequest {
  string watchlist_id = 1;
}

message DeleteWatchlistResponse {}
