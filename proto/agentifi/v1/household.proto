syntax = "proto3";

package agentifi.v1;

import "agentifi/v1/common.proto";
import "agentifi/v1/options.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Which spaces the caller can see, who else is in them, and who may change
// that, plus one person's arrangement of one space and the space's setup
// guide.
//
// Listing, creating and the membership methods answer from the caller's
// memberships, before a client can send X-Space-Id, so they are USER methods
// and name their space in the request. Rights over that space are checked
// from the caller's own accepted membership in it: a space the caller is not
// in, a malformed id and an outstanding invitation are all not found.
service HouseholdService {
  option (scope) = SCOPE_IDENTITY;

  // Every space the caller has joined. An outstanding invitation grants
  // nothing and is not listed.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "GET"
      path: "/spaces"
      response_body: "spaces"
    };
  }

  // A second set of finances, owned by whoever asked for it.
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "POST"
      path: "/spaces"
      status: 201
      response_body: "space"
    };
  }

  // The space X-Space-Id selected, or the default it falls back to.
  rpc GetCurrentSpace(GetCurrentSpaceRequest) returns (GetCurrentSpaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/spaces/current"
      response_body: "space"
    };
  }

  // How the current space is displayed, which any member who can write sets;
  // renaming is an owner's act.
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "PATCH"
      path: "/spaces/current/preferences"
      response_body: "space"
    };
  }

  // The caller's own arrangement of the current space's dashboard.
  rpc GetDashboardLayout(GetDashboardLayoutRequest) returns (GetDashboardLayoutResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/spaces/current/dashboard"
    };
  }

  // READ although it writes: it changes only the caller's own arrangement,
  // not the household's money, and a viewer's dashboard is theirs.
  rpc SaveDashboardLayout(SaveDashboardLayoutRequest) returns (SaveDashboardLayoutResponse) {
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "PUT"
      path: "/spaces/current/dashboard"
    };
  }

  // The invitee's side: what the caller has been asked to join and has not
  // taken.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "GET"
      path: "/spaces/invitations"
      response_body: "invitations"
    };
  }

  // Takes an invitation; someone else's is not found. The space comes back
  // whole for the client to switch to.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "POST"
      path: "/spaces/invitations/{membership_id}/accept"
      response_body: "space"
      body_optional: true
    };
  }

  // Drops an invitation, which changes nothing about what the caller can see.
  rpc DeclineInvitation(DeclineInvitationRequest) returns (DeclineInvitationResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "DELETE"
      path: "/spaces/invitations/{membership_id}"
      status: 204
    };
  }

  // An owner's act.
  rpc RenameSpace(RenameSpaceRequest) returns (RenameSpaceResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "PATCH"
      path: "/spaces/{space_id}"
      response_body: "space"
    };
  }

  // Removes a space and everything in it, for every member. Only an owner may,
  // never an admin, and only with the space's name typed out, and the caller
  // keeps at least one space. Where the server writes backups, a set is taken
  // first and a failed one deletes nothing.
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "POST"
      path: "/spaces/{space_id}/delete"
    };
  }

  // Everyone in one space, invitations included.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "GET"
      path: "/spaces/{space_id}/members"
      response_body: "members"
    };
  }

  // Invites an existing account, unaccepted, which grants nothing until
  // taken. Only the server administrator makes logins.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "POST"
      path: "/spaces/{space_id}/members"
      status: 201
      response_body: "member"
    };
  }

  // Only an owner gives or takes the owner role, and a space keeps an
  // accepted owner.
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "PATCH"
      path: "/spaces/{space_id}/members/{membership_id}"
      response_body: "member"
    };
  }

  // Revokes somebody else's membership, which takes an owner, or gives up
  // the caller's own, which does not.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (access) = ACCESS_USER;
    option (rest) = {
      method: "DELETE"
      path: "/spaces/{space_id}/members/{membership_id}"
      status: 204
    };
  }

  // The steps a new space goes through, each checked off by what the ledger
  // shows rather than by a click.
  rpc GetSetupGuide(GetSetupGuideRequest) returns (GetSetupGuideResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_READ;
    option (rest) = {
      method: "GET"
      path: "/setup-guide"
      response_body: "guide"
    };
  }

  // Hiding the guide and skipping a step are the only things stored; both
  // are the space's.
  rpc UpdateSetupGuide(UpdateSetupGuideRequest) returns (UpdateSetupGuideResponse) {
    option (access) = ACCESS_WRITE;
    option (rest) = {
      method: "PATCH"
      path: "/setup-guide"
      response_body: "guide"
    };
  }
}

// A member's rights in one space, in descending order.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  // Everything except the owner's membership, which only an owner changes.
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
  ROLE_VIEWER = 4;
}

// A space as one member sees it, with that member's rights attached.
message Space {
  string id = 1;
  string name = 2;
  string primary_currency = 3;
  string timezone = 4;
  // The preset a page opens on; empty is the client's default.
  string default_date_range = 5;
  // Unset lists every account type, unlike an empty set.
  IdSet sidebar_account_types = 6;
  Role role = 7;
  bool can_write = 8;
  // True for an admin too: may change membership, rename and delete.
  bool is_owner = 9;
  // Never unset on a listed space.
  google.protobuf.Timestamp joined_at = 10;
}

message Member {
  // The membership id.
  string id = 1;
  string user_id = 2;
  string email = 3;
  optional string full_name = 4;
  Role role = 5;
  google.protobuf.Timestamp invited_at = 6;
  // Unset while the invitation is outstanding, which grants nothing.
  google.protobuf.Timestamp accepted_at = 7;
}

// An outstanding invitation as the invitee sees it, with the space's name,
// which nothing else gives a non-member.
message Invitation {
  // The membership id.
  string id = 1;
  string space_id = 2;
  string space_name = 3;
  Role role = 4;
  google.protobuf.Timestamp invited_at = 5;
}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message CreateSpaceRequest {
  // Required.
  string name = 1;
}

message CreateSpaceResponse {
  Space space = 1;
}

message GetCurrentSpaceRequest {}

message GetCurrentSpaceResponse {
  Space space = 1;
}

// A field named in update_mask and left unset is cleared back to its
// default; a field not named is left alone.
message UpdatePreferencesRequest {
  // One of the client's range presets.
  optional string default_date_range = 1;
  IdSet sidebar_account_types = 2;
  // The currency every figure in the space is reported in, so changing it
  // restamps the ledger. Cannot be cleared; clearing it changes nothing.
  optional string primary_currency = 3;
  google.protobuf.FieldMask update_mask = 4;
}

message UpdatePreferencesResponse {
  Space space = 1;
}

message GetDashboardLayoutRequest {}

// The layout is the client's: a list, opaque here.
message GetDashboardLayoutResponse {
  // Unset when there is none, which the client reads as its built-in order.
  google.protobuf.Value layout = 1;
}

message SaveDashboardLayoutRequest {
  // A list; unset or null clears it back to the built-in order.
  google.protobuf.Value layout = 1;
}

message SaveDashboardLayoutResponse {
  google.protobuf.Value layout = 1;
}

message ListInvitationsRequest {}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message AcceptInvitationRequest {
  string membership_id = 1;
}

message AcceptInvitationResponse {
  Space space = 1;
}

message DeclineInvitationRequest {
  string membership_id = 1;
}

message DeclineInvitationResponse {}

// A field named in update_mask and left unset is cleared; a field not named is
// left alone.
message RenameSpaceRequest {
  string space_id = 1;
  // Cannot be cleared.
  optional string name = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message RenameSpaceResponse {
  Space space = 1;
}

message DeleteSpaceRequest {
  string space_id = 1;
  // The space's name as it stands; spaces at either end are forgiven.
  string confirm_name = 2;
}

message DeleteSpaceResponse {
  // The backup set taken first; unset where the server writes none.
  optional string backup_set = 1;
}

message ListMembersRequest {
  string space_id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message InviteMemberRequest {
  string space_id = 1;
  // Of an account that exists.
  string email = 2;
  Role role = 3;
}

message InviteMemberResponse {
  Member member = 1;
}

message UpdateMemberRequest {
  string space_id = 1;
  string membership_id = 2;
  Role role = 3;
}

message UpdateMemberResponse {
  Member member = 1;
}

message RemoveMemberRequest {
  string space_id = 1;
  string membership_id = 2;
}

message RemoveMemberResponse {}

message SetupGuide {
  bool dismissed = 1;
  // Every step done or skipped.
  bool complete = 2;
  repeated SetupGuideStep steps = 3;
  // What somebody said does not apply, which a step skipped because it no
  // longer can be done is not.
  repeated string skipped = 4;
}

message SetupGuideStep {
  // import, connect, match, assistant, bills or backups.
  string id = 1;
  // done (the ledger shows it), skipped (somebody said it does not apply, or
  // it no longer can) or open.
  string state = 2;
  // An optional step does not keep the guide open.
  bool optional = 3;
}

message GetSetupGuideRequest {}

message GetSetupGuideResponse {
  SetupGuide guide = 1;
}

// A field named in update_mask and left unset is left alone, as a null was.
message UpdateSetupGuideRequest {
  optional bool dismissed = 1;
  // The whole list of steps that do not apply. Matching is never in it: it
  // follows connecting.
  IdSet skipped = 2;
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSetupGuideResponse {
  SetupGuide guide = 1;
}
